<form method="POST" action="{% url 'create_product' %}">

    {% csrf_token %}

    <input
        type="text"
        name="name"
        placeholder="Product name"
    >

    <input
        type="number"
        name="price"
        placeholder="Price"
    >

    <input
        type="number"
        name="stock"
        placeholder="Stock"
    >
    <select name="category" id="" required>
        <option value="">
            -- SELECT CATEGORY ---
        </option>
        {% for category in categories %}
        <option value="{{category.id}}">
            {{category.name}}
        </option>
        {% endfor %}

    </select>

    <button type="submit">
        Create Product
    </button>

</form>
