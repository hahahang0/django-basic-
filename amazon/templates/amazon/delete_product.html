 <h2>Delete Product</h2>
 <p>Are you sure you want to delete 
    <strong>{{product.name}}</strong>
 </p>
 <form action="{% url 'delete_product' product.id %}"
      method="POST"
      
      >
        {% csrf_token %}

        <button type="submit">Yes, Delete</button>

     </form>


<a href="{% url 'product-list' %}">
    Cancel
</a>
