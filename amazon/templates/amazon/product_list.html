<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
</head>
<body>
    <h1>Products</h1>

    {% for product in products %}
    <div>
        <h2>
            {{product.name}}
        </h2>
        <p>
            {{product.price}}
        </p>
        <p>
            Stock: {{ product.stock }}
        </p>
    </div>
    <a href="{% url 'update_product' product.id %}">Edit</a>
    {% empty %}
    <p>No products available. </p>

    {% endfor %}

</body>
</html>
